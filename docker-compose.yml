services:
  postgres:
    image: postgres:17
    container_name: curlchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curlchat}
      POSTGRES_USER: ${POSTGRES_USER:-curlchat_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curlchat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curlchat_owner} -d ${POSTGRES_DB:-curlchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: curlchat-phoenix
    restart: unless-stopped
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "${PHOENIX_GRPC_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://curlchat_app:${POSTGRES_PASSWORD:-curlchat}@postgres:5432/${POSTGRES_DB:-curlchat}
      STATE_DATABASE_URL: postgresql+psycopg://curlchat_state:${POSTGRES_PASSWORD:-curlchat}@postgres:5432/${POSTGRES_DB:-curlchat}
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-curlchat_owner}:${POSTGRES_PASSWORD:-curlchat}@postgres:5432/${POSTGRES_DB:-curlchat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_AGENT_MAX_COMPLETION_TOKENS: ${OPENAI_AGENT_MAX_COMPLETION_TOKENS:-800}
      OPENAI_SQL_MAX_COMPLETION_TOKENS: ${OPENAI_SQL_MAX_COMPLETION_TOKENS:-600}
      OPENAI_AGENT_REASONING_EFFORT: ${OPENAI_AGENT_REASONING_EFFORT:-low}
      OPENAI_SQL_REASONING_EFFORT: ${OPENAI_SQL_REASONING_EFFORT:-minimal}
      ANALYTICS_STATEMENT_TIMEOUT_MS: ${ANALYTICS_STATEMENT_TIMEOUT_MS:-5000}
      PHOENIX_TRACING_ENABLED: ${PHOENIX_TRACING_ENABLED:-false}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-curlchat}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  importer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["import"]
    command: ["sh", "/app/docker/import-archive.sh"]
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-curlchat_owner}:${POSTGRES_PASSWORD:-curlchat}@postgres:5432/${POSTGRES_DB:-curlchat}
      DATABASE_URL: postgresql+psycopg://curlchat_app:${POSTGRES_PASSWORD:-curlchat}@postgres:5432/${POSTGRES_DB:-curlchat}
      STATE_DATABASE_URL: postgresql+psycopg://curlchat_state:${POSTGRES_PASSWORD:-curlchat}@postgres:5432/${POSTGRES_DB:-curlchat}
    volumes:
      - ${ARCHIVE_PATH:-./.archive}:/archive:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  phoenix_data:
