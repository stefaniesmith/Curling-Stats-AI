[project]
name = "curlchat-backend"
version = "0.1.0"
description = "FastAPI backend for the CurlChat conversational analytics application."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.0",
  "arize-phoenix-otel>=0.16.0",
  "fastapi>=0.116.0",
  "langchain>=0.3.27",
  "langchain-openai>=0.3.0",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "openinference-instrumentation-langchain>=0.1.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.1.0",
  "sqlalchemy>=2.0.42",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "polyfactory>=2.22.3",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curlchat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
package = true
